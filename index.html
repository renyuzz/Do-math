<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打球要賺錢</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 隱藏內容的輔助 class */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ==================== 全倒盃 STRIKE CUP 專屬樣式 ==================== */
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+TC:wght@400;700;900&display=swap');

    .strike-cup-container {
        font-family: 'Noto Sans TC', sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
    }

    .font-sport {
        font-family: 'Black Ops One', cursive;
    }

    :root {
        --name-w: 65px;   
        --total-w: 50px;  
    }

    .table-container {
        display: grid;
        grid-template-columns: var(--name-w) 1fr; /* 移除全倒統計欄位 */
        overflow: hidden;
        width: 100%;
        border-top: 1px solid #1e293b;
        border-bottom: 1px solid #1e293b;
    }

    .side-col {
        background-color: #1e293b;
        z-index: 10;
        display: flex;
        flex-direction: column;
    }

    .side-col-left { border-right: 1px solid #334155; }
    
    .grid-area {
        display: flex;
        flex-direction: column;
        background-color: #0f172a;
    }

    .row-h {
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #1e293b;
    }

    .header-h {
        height: 35px;
        font-size: 9px;
        color: #64748b;
        text-transform: uppercase;
        font-weight: 900;
        background-color: #0f172a;
    }

    .strike-cell {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid rgba(30, 41, 59, 0.5);
        cursor: pointer;
        transition: all 0.1s;
        min-width: 0;
    }

    .strike-cell.active {
        background-color: #ef4444 !important;
        color: white !important;
    }

    .card-winner {
        background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
        box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }

    .name-text {
        font-size: 11px;
        font-weight: 900;
        padding: 0 2px;
        text-align: center;
        width: 100%;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 p-4 font-sans flex justify-center items-start">
  
  <!-- ==================== 彈出式廣告 ==================== -->
  <div id="popup-ad" class="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
    <div class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden max-w-md w-full animate-[bounce_0.5s_ease-out]">
      <!-- 關閉按鈕 -->
      <button onclick="closeAd()" class="absolute top-2 right-2 z-10 bg-black/50 text-white hover:bg-red-600 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      
      <!-- 廣告圖片 -->
      <div class="w-full h-auto flex flex-col items-center">
        <!-- 💡 只需要修改下一行的 src="..." 裡面的網址 💡 -->
        <img src="260570.jpg" alt="活動廣告" class="w-full h-auto object-contain max-h-[70vh]">
        <div class="p-4 bg-slate-900 w-full text-center">
          <button onclick="closeAd()" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-8 rounded-full shadow-lg transition-transform active:scale-95">
            進入工具
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden mt-6">
    
    <!-- 頂部導覽列 (Tabs) -->
    <div class="bg-blue-600 dark:bg-blue-700 pt-4 px-4 flex flex-col items-center">
      <h1 class="text-xl font-bold text-white flex items-center justify-center gap-2 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="10" cy="9" r="1" fill="currentColor"></circle>
          <circle cx="14" cy="9" r="1" fill="currentColor"></circle>
          <circle cx="12" cy="13" r="1" fill="currentColor"></circle>
        </svg>
        保齡球多功能工具
      </h1>
      
      <!-- 頁籤按鈕 -->
      <div class="flex w-full space-x-1 bg-blue-700/50 dark:bg-blue-800/50 p-1 rounded-t-xl">
        <button onclick="switchTab('tab-calculator')" id="btn-calculator" class="flex-1 py-2 text-sm font-medium rounded-t-lg transition-colors bg-white text-blue-700 dark:bg-slate-800 dark:text-blue-300">
          B標換算
        </button>
        <button onclick="switchTab('tab-strikecup')" id="btn-strikecup" class="flex-1 py-2 text-sm font-medium rounded-t-lg transition-colors text-blue-100 hover:text-white dark:text-slate-300">
          全倒盃
        </button>
      </div>
    </div>

    <!-- ==================== 分頁 1: B標換算器 ==================== -->
    <div id="tab-calculator" class="tab-content active p-6 space-y-6">
      
      <!-- 輸入區塊 -->
      <div class="space-y-4">
        <!-- A標分數 -->
        <div>
          <label class="block text-sm font-medium mb-1">A標分數</label>
          <input 
            type="number" 
            id="baseScore"
            value="200"
            class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all dark:text-white"
            placeholder="請輸入A標分數"
          />
        </div>

        <!-- 顯示模式 -->
        <div>
          <label class="block text-sm font-medium mb-1">顯示模式</label>
          <select 
            id="cupMode"
            class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all dark:text-white"
          >
            <option value="all">全部倍率</option>
            <option value="leisure_dajiale">超越休閒 / 大家樂</option>
            <option value="golden_feedback">黃金回饋</option>
            <option value="golden_fuying_xiongfeng">黃金府瀛 / 雄風</option>
            <option value="neipu_qulian">內埔曲聯</option>
            <option value="guanyuan_monthly">冠源月賽</option>
          </select>
        </div>

        <!-- 賽事專屬提示區塊 -->
        <div id="tournamentHint" class="hidden text-sm text-rose-600 dark:text-rose-400 font-medium bg-rose-50 dark:bg-rose-900/20 p-3 rounded-xl border border-rose-200 dark:border-rose-800 text-center shadow-sm">
        </div>
      </div>

      <!-- B標結果 -->
      <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
        <h2 class="text-sm font-medium mb-3 text-slate-500 dark:text-slate-400 text-center">
           各倍率計算結果 (無條件捨去至小數第二位)
        </h2>
        <div id="resultsGrid" class="grid grid-cols-3 gap-3 max-h-[350px] overflow-y-auto p-1" style="scrollbar-width: thin;">
          <!-- 結果會顯示在這裡 -->
        </div>
      </div>

    </div>

    <!-- ==================== 分頁 2: 全倒盃 STRIKE CUP ==================== -->
    <div id="tab-strikecup" class="tab-content bg-[#0f172a] text-[#f8fafc] strike-cup-container pb-10">
      
        <!-- Header -->
        <header class="p-4 pt-6 text-center bg-slate-900 rounded-b-[2rem] shadow-2xl border-b-2 border-red-500">
            <h1 class="text-4xl font-sport text-red-500 italic tracking-tighter drop-shadow-md">STRIKE CUP</h1>
            <div class="mt-1 text-slate-400 text-[10px] font-bold tracking-widest uppercase">全倒盃</div>
            
            <div class="flex justify-center gap-1.5 mt-4">
                <div class="bg-slate-800 px-2 py-1.5 rounded-lg border border-slate-700 text-[8px]">
                    <div class="text-slate-500">1-6人</div>
                    <div class="text-blue-400 font-black">取 1</div>
                </div>
                <div class="bg-slate-800 px-2 py-1.5 rounded-lg border border-slate-700 text-[8px]">
                    <div class="text-slate-500">7-11人</div>
                    <div class="text-green-400 font-black">取 1-2</div>
                </div>
                <div class="bg-slate-800 px-2 py-1.5 rounded-lg border border-slate-700 text-[8px]">
                    <div class="text-slate-500">12人+</div>
                    <div class="text-purple-400 font-black">取 1-3</div>
                </div>
            </div>
        </header>

        <!-- 輸入區域 -->
        <section class="p-4 mt-2 space-y-3">
            <div class="flex flex-col gap-2">
                <!-- 新增玩家區域 -->
                <div class="flex gap-2 items-center">
                    <div class="flex-1 bg-slate-800 p-1.5 rounded-xl border border-slate-700 shadow-inner">
                        <input id="player-name" type="text" placeholder="輸入玩家姓名..." 
                            onkeydown="if(event.key==='Enter') addPlayer()"
                            class="bg-transparent w-full px-3 py-2 text-white outline-none font-bold text-sm">
                    </div>
                    <button onclick="addPlayer()" 
                        class="bg-red-600 hover:bg-red-500 text-white px-5 h-12 rounded-xl font-black text-sm active:scale-95 transition shadow-lg shrink-0">
                        新增玩家
                    </button>
                </div>

                <div class="flex items-center gap-2 bg-slate-800/50 p-2 rounded-xl border border-slate-700/50">
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-2">每格費用 $</label>
                    <input id="stake-amount" type="number" value="20" onchange="calculateAndRender()"
                        class="bg-slate-900 w-20 px-3 py-1 rounded-lg text-red-400 font-sport text-center border border-slate-700 focus:border-red-500 outline-none">
                </div>
            </div>
            
            <!-- 玩家標籤 (點擊 X 可移除) -->
            <div id="player-tags" class="flex flex-wrap gap-2 px-1"></div>
        </section>

        <!-- 紀錄表格 -->
        <section class="mt-2">
            <div class="table-container">
                <!-- 左欄：姓名 -->
                <div class="side-col side-col-left">
                    <div class="header-h flex items-center justify-center border-b border-slate-800">姓名</div>
                    <div id="name-col-body"></div>
                </div>

                <!-- 中欄：1-10格 -->
                <div class="grid-area">
                    <div id="frame-header" class="header-h flex w-full"></div>
                    <div id="grid-col-body"></div>
                </div>
            </div>
            <div class="p-2 text-center text-[9px] text-slate-600 font-bold bg-slate-950/30 italic">
                TIPS: 點擊格子紀錄全倒 X · 每人每格 $ <span id="display-stake">20</span>
            </div>
        </section>

        <!-- 結算彙整 -->
        <section class="p-4 mt-1">
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="text-xl font-black italic text-slate-200 tracking-tight underline decoration-red-500 decoration-2 underline-offset-4">輸贏總額</h2>
                <div class="flex gap-2">
                    <button onclick="resetScores()" class="px-3 py-1.5 bg-slate-800 text-red-500 text-[9px] font-black rounded-lg border border-red-900/30 active:bg-red-900/50 transition shadow-sm">
                        清空 X
                    </button>
                    <button onclick="clearPlayers()" class="px-3 py-1.5 bg-slate-800 text-slate-400 text-[9px] font-black rounded-lg border border-slate-700 active:bg-slate-700 transition shadow-sm">
                        重置名單
                    </button>
                </div>
            </div>
            <div id="summary-list" class="space-y-3"></div>
        </section>

    </div>

  </div>

  <!-- Toast (共用通知元件) -->
  <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-red-600 text-white px-8 py-4 rounded-2xl opacity-0 pointer-events-none transition-all z-50 font-bold shadow-2xl"></div>

  <script>
    // ==================== 廣告控制邏輯 ====================
    function closeAd() {
      const ad = document.getElementById('popup-ad');
      ad.style.opacity = '0';
      setTimeout(() => {
        ad.style.display = 'none';
      }, 300); // 等待淡出動畫結束
    }

    // 點擊背景也可以關閉廣告
    document.getElementById('popup-ad').addEventListener('click', function(e) {
      if (e.target === this) {
        closeAd();
      }
    });

    // ==================== 分頁切換邏輯 ====================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => {
        el.classList.remove('active');
      });
      document.getElementById(tabId).classList.add('active');
      
      const btnCalc = document.getElementById('btn-calculator');
      const btnOther = document.getElementById('btn-strikecup');
      
      const inactiveClasses = ['text-blue-100', 'hover:text-white', 'dark:text-slate-300'];
      const activeClasses = ['bg-white', 'text-blue-700', 'dark:bg-slate-800', 'dark:text-blue-300'];
      
      btnCalc.classList.remove(...activeClasses);
      btnCalc.classList.add(...inactiveClasses);
      btnOther.classList.remove(...activeClasses);
      btnOther.classList.add(...inactiveClasses);

      const activeBtn = tabId === 'tab-calculator' ? btnCalc : btnOther;
      activeBtn.classList.remove(...inactiveClasses);
      activeBtn.classList.add(...activeClasses);
    }

    // ==================== [分頁1] B標換算邏輯 ====================
    const baseScoreInput = document.getElementById('baseScore');
    const resultsGrid = document.getElementById('resultsGrid');
    const cupModeSelect = document.getElementById('cupMode');
    const tournamentHint = document.getElementById('tournamentHint');

    const modes = {
      all: [],
      leisure_dajiale: ["0.60", "0.64", "0.68", "0.72", "0.76", "0.80", "0.84", "0.88"],
      golden_feedback: ["0.70", "0.72", "0.74", "0.76", "0.78", "0.80", "0.82", "0.84", "0.86", "0.88", "0.90"],
      golden_fuying_xiongfeng: ["0.72", "0.73", "0.74", "0.75", "0.76", "0.77", "0.78", "0.79", "0.80", "0.81", "0.82"],
      neipu_qulian: ["0.55", "0.60", "0.65", "0.70", "0.75", "0.80", "0.85", "0.90", "0.95"],
      guanyuan_monthly: ["0.91", "0.88", "0.85", "0.82", "0.79", "0.76", "0.71", "0.68"]
    };

    for (let i = 0; i <= 32; i++) {
      modes.all.push((0.60 + i * 0.01).toFixed(2));
    }

    function calculate() {
      const baseScore = parseFloat(baseScoreInput.value) || 0;
      const activeMode = cupModeSelect.value;
      const activeMultipliers = modes[activeMode];
      
      if (activeMode === 'guanyuan_monthly') {
        tournamentHint.innerHTML = '💡 <strong>特別提示：</strong> 冠源月賽計算後 <strong>B標需再扣 30 分</strong>';
        tournamentHint.classList.remove('hidden');
      } else {
        tournamentHint.classList.add('hidden');
      }
      
      resultsGrid.innerHTML = '';
      
      activeMultipliers.forEach(multiplier => {
        // 更新：計算結果精確至小數點第二位，且無條件捨去
        const exactValue = baseScore * parseFloat(multiplier);
        // 加上 Number.EPSILON 避免浮點數誤差，乘 100 取整數再除 100 來捨去第三位以後
        const result = (Math.floor((exactValue + Number.EPSILON) * 100) / 100).toFixed(2);
        
        const card = document.createElement('div');
        card.className = "bg-blue-50 dark:bg-blue-900/20 rounded-xl p-3 border border-blue-100 dark:border-blue-800/50 flex flex-col items-center shadow-sm";
        card.innerHTML = `
          <span class="text-xs text-slate-500 dark:text-slate-400 mb-1">倍率 ${multiplier}</span>
          <span class="text-xl font-bold text-blue-700 dark:text-blue-300">${result}</span>
        `;
        resultsGrid.appendChild(card);
      });
    }

    baseScoreInput.addEventListener('input', calculate);
    cupModeSelect.addEventListener('change', calculate);
    calculate(); // 初始化 B標換算


    // ==================== [分頁2] 全倒盃 STRIKE CUP 邏輯 ====================
    let players = [];

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    }

    function addPlayer() {
        const input = document.getElementById('player-name');
        const name = input.value.trim();
        if (!name) return;
        if (players.find(p => p.name === name)) {
            showToast('❌ 姓名重複');
            return;
        }
        players.push({
            name: name,
            strikes: Array(10).fill(false),
            winLoss: 0
        });
        input.value = '';
        calculateAndRender();
    }

    function removePlayer(index) {
        if(confirm(`移除玩家「${players[index].name}」？`)) {
            players.splice(index, 1);
            calculateAndRender();
        }
    }

    function clearPlayers() {
        if(confirm(`確定要清空所有玩家名單嗎？`)) {
            players = [];
            calculateAndRender();
        }
    }

    function toggleStrike(pIdx, fIdx) {
        players[pIdx].strikes[fIdx] = !players[pIdx].strikes[fIdx];
        calculateAndRender();
    }

    function resetScores() {
        if(!confirm("確定要清空所有全倒紀錄嗎？")) return;
        players.forEach(p => p.strikes = Array(10).fill(false));
        calculateAndRender();
    }

    function calculateAndRender() {
        const stakeInput = document.getElementById('stake-amount');
        const currentStake = parseInt(stakeInput.value) || 0;
        document.getElementById('display-stake').innerText = currentStake;

        players.forEach(p => p.winLoss = 0);
        const pCount = players.length;

        if (pCount > 0) {
            for (let f = 0; f < 10; f++) {
                const strikers = [];
                const losers = [];
                players.forEach((p, idx) => {
                    if (p.strikes[f]) strikers.push(idx);
                    else losers.push(idx);
                });

                const sCount = strikers.length;
                let isConditionMet = false;

                if (pCount <= 6 && sCount === 1) {
                    isConditionMet = true;
                } else if (pCount >= 7 && pCount <= 11 && (sCount >= 1 && sCount <= 2)) {
                    isConditionMet = true;
                } else if (pCount >= 12 && (sCount >= 1 && sCount <= 3)) {
                    isConditionMet = true;
                }

                if (isConditionMet) {
                    const totalPool = losers.length * currentStake;
                    const winPerPerson = totalPool / sCount;
                    strikers.forEach(idx => players[idx].winLoss += winPerPerson);
                    losers.forEach(idx => players[idx].winLoss -= currentStake);
                }
            }
        }
        renderStrikeCup();
    }

    function renderStrikeCup() {
        // 1. 玩家標籤
        document.getElementById('player-tags').innerHTML = players.map((p, i) => `
            <div class="flex items-center bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg text-[11px] font-bold shadow-sm">
                <span class="text-slate-300">${p.name}</span>
                <button onclick="removePlayer(${i})" class="ml-2 text-red-500 font-black w-5 h-5 flex items-center justify-center bg-slate-900 rounded-full hover:bg-red-900 transition">×</button>
            </div>
        `).join('');

        // 2. 中欄標頭 (1-10 數字 - 雙數格深色背景)
        document.getElementById('frame-header').innerHTML = Array.from({length: 10}, (_, i) => {
            const bg = i % 2 !== 0 ? 'bg-slate-800/50' : '';
            return `<div class="flex-1 flex items-center justify-center border-r border-slate-800/30 font-black ${bg}">${i+1}</div>`;
        }).join('');

        // 3. 左欄：姓名
        document.getElementById('name-col-body').innerHTML = players.map(p => `
            <div class="row-h border-slate-800/50">
                <span class="name-text truncate">${p.name}</span>
            </div>
        `).join('');

        // 4. 中欄：1-10格 (雙數格深色背景)
        document.getElementById('grid-col-body').innerHTML = players.map((p, pIdx) => `
            <div class="row-h flex border-slate-800/50">
                ${p.strikes.map((s, fIdx) => {
                    const bg = fIdx % 2 !== 0 ? 'bg-slate-800/50' : '';
                    return `
                    <div onclick="toggleStrike(${pIdx}, ${fIdx})" 
                        class="strike-cell h-full ${bg} ${s ? 'active' : ''}">
                        <span class="font-sport text-sm ${s ? 'text-white' : 'text-slate-800'}">${s ? 'X' : '·'}</span>
                    </div>
                    `;
                }).join('')}
            </div>
        `).join('');

        // 5. 結算卡片
        const summaryContainer = document.getElementById('summary-list');
        if (players.length === 0) {
            summaryContainer.innerHTML = '<div class="text-center py-8 text-slate-700 font-bold text-[10px]">請先新增玩家名單</div>';
            return;
        }

        summaryContainer.innerHTML = players.map(p => {
            const isWinner = p.winLoss > 0;
            const isLoser = p.winLoss < 0;
            const amount = Math.round(p.winLoss);
            return `
                <div class="p-4 rounded-3xl flex justify-between items-center transition-all ${isWinner ? 'card-winner text-white scale-[1.02]' : 'bg-slate-800/50 border border-slate-700'}">
                    <div>
                        <div class="text-xl font-black italic tracking-tight">${p.name}</div>
                        <div class="${isWinner ? 'text-red-200' : 'text-slate-500'} text-[9px] font-bold mt-1 uppercase">
                            Strikes: ${p.strikes.filter(s => s).length} / 10
                        </div>
                    </div>
                    <div class="text-2xl font-sport ${isWinner ? 'text-white' : isLoser ? 'text-red-500' : 'text-slate-600'}">
                        ${amount > 0 ? '+' : ''}${amount}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    calculateAndRender(); // 初始化全倒盃畫面

  </script>
</body>
</html>
